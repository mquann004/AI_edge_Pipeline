name: Edge AI Model Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-model-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare release variables
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          MODEL_NAME="yolov8n_edge_model"
          PACKAGE_NAME="${MODEL_NAME}_${TAG_NAME}.zip"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${PACKAGE_NAME}"

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "MODEL_NAME=$MODEL_NAME" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

          echo "Tag name: $TAG_NAME"
          echo "Package name: $PACKAGE_NAME"
          echo "Download URL: $DOWNLOAD_URL"

      - name: Create runtime folders
        run: |
          mkdir -p models
          mkdir -p outputs
          mkdir -p packages
          mkdir -p edge_device

      - name: Run environment tests
        run: |
          pytest tests/

      - name: Export YOLO model to ONNX
        run: |
          python tools/export_yolo_to_onnx.py \
            --model yolov8n.pt \
            --output models/yolov8n.onnx \
            --imgsz 640

      - name: Run YOLO image detection with ONNX model
        run: |
          python inference/run_onnx_detection.py \
            --model models/yolov8n.onnx \
            --image images/dog.jpg \
            --output outputs

      - name: Create release model package
        run: |
          python tools/create_model_package.py \
            --model models/yolov8n.onnx \
            --output packages \
            --name "${MODEL_NAME}" \
            --version "${TAG_NAME}" \
            --format onnx \
            --imgsz 640 \
            --download-url "${DOWNLOAD_URL}"

      - name: Test OTA update with release package
        run: |
          PACKAGE_FILE="packages/${PACKAGE_NAME}"

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "Expected package not found: $PACKAGE_FILE"
            echo "Available packages:"
            ls -la packages
            exit 1
          fi

          python update_agent/ota_update_agent.py \
            --package "$PACKAGE_FILE" \
            --device-dir edge_device \
            --force

      - name: Test edge runtime inference service
        run: |
          python edge_runtime/inference_service.py \
            --device-dir edge_device \
            --image images/dog.jpg \
            --output outputs/release_edge_runtime_result.jpg \
            --metrics outputs/release_edge_runtime_metrics.json

      - name: Show release package contents
        run: |
          echo "Packages:"
          ls -la packages

          echo "Edge device current:"
          ls -la edge_device/current

          echo "Manifest content:"
          unzip -p "packages/${PACKAGE_NAME}" manifest.json

          echo "Runtime metrics:"
          cat outputs/release_edge_runtime_metrics.json

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG_NAME}" \
            "packages/${PACKAGE_NAME}#${PACKAGE_NAME}" \
            --title "Edge AI Model ${TAG_NAME}" \
            --notes "Release ${TAG_NAME} for Edge AI ONNX model package. This package includes the ONNX model, metadata.json, and manifest.json for OTA update."

      - name: Upload release test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-test-artifacts
          path: |
            outputs/
            edge_device/
            packages/