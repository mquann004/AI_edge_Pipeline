name: Edge AI CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ai-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check project structure
        run: |
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la
          
          echo "Create runtime folders if missing:"
          mkdir -p models
          mkdir -p outputs
          
          echo "Check source folders:"
          test -d inference
          test -d images
          test -d tools
          
          echo "Check required files:"
          test -f inference/run_image_detection.py
          test -f inference/run_onnx_detection.py
          test -f tools/export_yolo_to_onnx.py
          test -f images/dog.jpg\
          test -f requirements.txt
      - name: Run environment tests
        run: |
          pytest tests/

      - name: Run YOLO image detection with PyTorch model
        run: |
          python inference/run_image_detection.py --image images/dog.jpg --output outputs

      - name: Export YOLO model to ONNX
        run: |
          python tools/export_yolo_to_onnx.py --model yolov8n.pt --output models/yolov8n.onnx

      - name: Run YOLO image detection with ONNX model
        run: |
          python inference/run_onnx_detection.py --model models/yolov8n.onnx --image images/dog.jpg --output outputs

      - name: Upload detection results
        uses: actions/upload-artifact@v4
        with:
          name: detection-results
          path: outputs/

      - name: Upload ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: models/yolov8n.onnx